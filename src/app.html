<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			/* Theme boot: runs before paint so there is no flash of the wrong theme. */
			(function () {
				try {
					var stored = localStorage.getItem('anchor-brief:theme');
					if (stored === 'dark' || stored === 'light') {
						document.documentElement.setAttribute('data-theme', stored);
						return;
					}
				} catch (e) {
					/* private mode */
				}
				var light =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
				document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
