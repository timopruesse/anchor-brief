<script>
/* Theme boot: runs before paint so there is no flash of the wrong theme. */
(function () {
  try {
    var stored = localStorage.getItem('anchor-brief:theme');
    if (stored === 'dark' || stored === 'light') {
      document.documentElement.setAttribute('data-theme', stored);
      return;
    }
  } catch (e) { /* private mode / file:// restrictions: fall through */ }
  var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();

<style>
/* ============================================================
   Anchor Brief — editorial briefing page
   Dark warm neutrals, one accent, system font stacks only.
   ============================================================ */

/* ---- tokens: dark (default) ---- */
:root {
  color-scheme: dark;

  --bg:            #14110f;
  --bg-veil:       rgba(20, 17, 15, 0.86);
  --surface:       #1b1714;
  --surface-2:     #221d19;
  --line:          #2e2822;
  --line-soft:     #241f1b;
  --ink:           #f3ece4;
  --ink-2:         #cfc5b9;
  --ink-3:         #a1968a;
  --ink-4:         #7d7267;
  --accent:        #e0a267;
  --accent-ink:    #1a1512;
  --accent-soft:   rgba(224, 162, 103, 0.13);
  --accent-line:   rgba(224, 162, 103, 0.34);
  --shadow:        0 1px 2px rgba(0,0,0,.35), 0 12px 32px -18px rgba(0,0,0,.75);

  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --measure: 40rem;
  --gutter: clamp(1.15rem, 4vw, 2.75rem);
  --radius: 14px;
  --radius-sm: 9px;
}

/* ---- tokens: light ---- */
:root[data-theme="light"] {
  color-scheme: light;

  --bg:            #f6f2ec;
  --bg-veil:       rgba(246, 242, 236, 0.88);
  --surface:       #fffdf9;
  --surface-2:     #f1eae0;
  --line:          #e0d6c8;
  --line-soft:     #eae2d6;
  --ink:           #1d1916;
  --ink-2:         #423a33;
  --ink-3:         #6c6157;
  --ink-4:         #8a7e72;
  --accent:        #9b551a;
  --accent-ink:    #fffdf9;
  --accent-soft:   rgba(155, 85, 26, 0.10);
  --accent-line:   rgba(155, 85, 26, 0.30);
  --shadow:        0 1px 2px rgba(60,45,30,.06), 0 14px 30px -20px rgba(60,45,30,.28);
}

/* No-JS / no-stored-preference: honour the OS. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:            #f6f2ec;
    --bg-veil:       rgba(246, 242, 236, 0.88);
    --surface:       #fffdf9;
    --surface-2:     #f1eae0;
    --line:          #e0d6c8;
    --line-soft:     #eae2d6;
    --ink:           #1d1916;
    --ink-2:         #423a33;
    --ink-3:         #6c6157;
    --ink-4:         #8a7e72;
    --accent:        #9b551a;
    --accent-ink:    #fffdf9;
    --accent-soft:   rgba(155, 85, 26, 0.10);
    --accent-line:   rgba(155, 85, 26, 0.30);
    --shadow:        0 1px 2px rgba(60,45,30,.06), 0 14px 30px -20px rgba(60,45,30,.28);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}

h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.18; letter-spacing: -0.011em; }

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
:focus:not(:focus-visible) { outline: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 0.75rem; top: -3rem;
  z-index: 60;
  background: var(--accent); color: var(--accent-ink);
  padding: 0.55rem 0.9rem; border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-size: 0.85rem; font-weight: 600; text-decoration: none;
  transition: top 140ms ease;
}
.skip-link:focus { top: 0; }

/* ---- shell ---- */
.wrap {
  width: 100%;
  max-width: calc(var(--measure) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* ---- reading progress ---- */
.progress {
  position: fixed; inset: 0 0 auto 0;
  height: 2px; z-index: 50;
  background: transparent;
  pointer-events: none;
}
.progress__bar {
  height: 100%; width: 0%;
  background: var(--accent);
  transform-origin: 0 50%;
  transition: width 90ms linear;
}

/* ---- masthead ---- */
.masthead {
  border-bottom: 1px solid var(--line);
  padding-block: clamp(1.5rem, 4vw, 2.5rem) 1.15rem;
  background: var(--bg);
}
.masthead__row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem;
}
.brand {
  display: flex; align-items: baseline; gap: 0.6rem;
  min-width: 0;
}
.brand__mark {
  flex: none;
  width: 0.62rem; height: 0.62rem;
  border-radius: 2px;
  background: var(--accent);
  transform: translateY(-0.12em);
}
.brand__name {
  font-family: var(--serif);
  font-size: clamp(1.32rem, 4.2vw, 1.6rem);
  font-weight: 600;
  letter-spacing: -0.015em;
}
.masthead__meta {
  margin-top: 0.85rem;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 0.4rem 0.7rem;
  font-size: 0.78rem;
  color: var(--ink-3);
}
.edition {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--sans);
  font-size: 0.72rem; font-weight: 650;
  letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  padding: 0.24rem 0.6rem;
}
.masthead__meta .dot { color: var(--ink-4); }
.masthead__meta time,
.masthead__meta .coverage { font-variant-numeric: tabular-nums; }

/* ---- icon buttons ---- */
.iconbtn {
  flex: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  height: 2.25rem; min-width: 2.25rem;
  padding: 0 0.62rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font: inherit; font-size: 0.78rem;
  cursor: pointer;
  transition: color 140ms ease, border-color 140ms ease, background-color 140ms ease;
}
.iconbtn:hover { color: var(--ink); border-color: var(--accent-line); }
.iconbtn svg { width: 1rem; height: 1rem; flex: none; }
.iconbtn__label { display: none; }
@media (min-width: 34rem) { .iconbtn__label { display: inline; } }

/* ---- hero ---- */
.hero { padding-block: clamp(2rem, 7vw, 3.4rem) clamp(1.4rem, 4vw, 2rem); }
.hero__kicker {
  font-size: 0.7rem; font-weight: 650;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 0.85rem;
}
.hero__headline {
  font-family: var(--serif);
  font-size: clamp(1.65rem, 6.2vw, 2.55rem);
  line-height: 1.16;
  letter-spacing: -0.02em;
  font-weight: 600;
  text-wrap: balance;
  color: var(--ink);
}
.hero__rule {
  margin-top: clamp(1.5rem, 4vw, 2.1rem);
  width: 3.5rem; height: 2px;
  background: var(--accent);
  border: 0;
}

/* ---- controls ---- */
.controls {
  position: sticky; top: 0; z-index: 40;
  padding-block: 0.85rem;
  background: var(--bg-veil);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.controls__inner { display: grid; gap: 0.7rem; }
.chips {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  margin: 0; padding: 0; border: 0;
}
.chip {
  display: inline-flex; align-items: center; gap: 0.42rem;
  padding: 0.34rem 0.72rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font: inherit;
  font-size: 0.8rem;
  line-height: 1.3;
  cursor: pointer;
  transition: color 140ms ease, border-color 140ms ease, background-color 140ms ease;
}
.chip:hover { color: var(--ink); border-color: var(--accent-line); }
.chip__count {
  font-family: var(--mono);
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-4);
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.chip[aria-pressed="true"] .chip__count { color: var(--accent-ink); opacity: 0.72; }
.chip[data-empty="true"]:not([aria-pressed="true"]) { opacity: 0.45; }

.searchrow { display: flex; align-items: center; gap: 0.55rem; }
.search {
  position: relative; flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center;
}
.search svg {
  position: absolute; left: 0.7rem;
  width: 0.95rem; height: 0.95rem;
  color: var(--ink-4); pointer-events: none;
}
.search input {
  width: 100%;
  padding: 0.5rem 2.1rem 0.5rem 2.1rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: inherit; font-size: 0.88rem;
}
.search input::placeholder { color: var(--ink-4); }
.search input:hover { border-color: var(--accent-line); }
.search__clear {
  position: absolute; right: 0.32rem;
  display: none; align-items: center; justify-content: center;
  width: 1.65rem; height: 1.65rem;
  border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-3);
  font: inherit; font-size: 1rem; line-height: 1;
  cursor: pointer;
}
.search__clear:hover { color: var(--ink); background: var(--surface-2); }
.search[data-filled="true"] .search__clear { display: inline-flex; }

.status {
  font-size: 0.75rem;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
  display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline;
}
.status__reset {
  border: 0; background: none; padding: 0;
  font: inherit; color: var(--accent);
  cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}

/* ---- stories ---- */
.stories { padding-block: clamp(1.6rem, 5vw, 2.6rem) 1rem; display: grid; gap: 0; }

.story {
  padding-block: clamp(1.7rem, 5vw, 2.5rem);
  border-top: 1px solid var(--line-soft);
}
.stories > .story:first-child { border-top: 0; padding-top: 0.4rem; }

.story__eyebrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.55rem;
  margin-bottom: 0.7rem;
}
.flag {
  font-size: 0.66rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent);
}
.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0; padding: 0; list-style: none; }
.tag {
  font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.1rem 0.4rem;
}

.story__title {
  font-family: var(--serif);
  font-size: clamp(1.22rem, 4.4vw, 1.5rem);
  line-height: 1.22;
  letter-spacing: -0.014em;
  text-wrap: pretty;
}
.story[data-weight="lead"] .story__title {
  font-size: clamp(1.5rem, 5.6vw, 2rem);
  line-height: 1.14;
  letter-spacing: -0.02em;
}
.story[data-weight="brief"] .story__title {
  font-family: var(--sans);
  font-size: 1.02rem;
  font-weight: 650;
  letter-spacing: -0.006em;
}
.story__title a { text-decoration: none; }
.story__title a:hover { color: var(--accent); }

/* ---- figure ---- */
.figure { margin: 1.25rem 0 0; }
.figure__frame {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  aspect-ratio: 16 / 9;
  background-image: var(--ph-gradient, linear-gradient(135deg, #2a2320, #191512));
}
.figure__frame img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.figure__frame[data-img="failed"] img { display: none; }
.figure figcaption {
  margin-top: 0.5rem;
  font-size: 0.72rem;
  color: var(--ink-4);
}
.figure figcaption a { color: var(--ink-3); text-decoration: underline; text-underline-offset: 2px; }
.figure figcaption a:hover { color: var(--accent); }

/* ---- facts ---- */
.facts { margin: 1rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
.story[data-weight="lead"] .facts { gap: 0.6rem; }
.facts li {
  position: relative;
  padding-left: 1.1rem;
  color: var(--ink-2);
  font-size: 0.95rem;
  line-height: 1.62;
}
.story[data-weight="lead"] .facts li { font-size: 1rem; }
.story[data-weight="brief"] .facts li { font-size: 0.9rem; line-height: 1.55; }
.facts li::before {
  content: "";
  position: absolute; left: 0.05rem; top: 0.72em;
  width: 0.32rem; height: 1px;
  background: var(--accent);
}
.facts mark, .story__title mark {
  background: var(--accent-soft);
  color: inherit;
  border-radius: 3px;
  padding: 0 0.12em;
  box-shadow: inset 0 -1px 0 var(--accent-line);
}

.more[hidden] { display: none; }

.why {
  margin-top: 1.1rem;
  padding: 0.85rem 1rem;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-left: 2px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.why__label {
  font-size: 0.66rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 0.3rem;
}
.why p {
  margin: 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  line-height: 1.55;
  color: var(--ink);
}

.toggle {
  margin-top: 0.9rem;
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.3rem 0.7rem 0.3rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-3);
  font: inherit; font-size: 0.78rem;
  cursor: pointer;
  transition: color 140ms ease, border-color 140ms ease;
}
.toggle:hover { color: var(--ink); border-color: var(--accent-line); }
.toggle__chev {
  width: 0.85rem; height: 0.85rem;
  transition: transform 180ms ease;
}
.toggle[aria-expanded="true"] .toggle__chev { transform: rotate(180deg); }

/* ---- sources ---- */
.sources { margin-top: 1.15rem; }
.sources ul {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}
.source {
  display: inline-flex; align-items: center; gap: 0.45rem;
  max-width: 100%;
  padding: 0.28rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 0.78rem;
  text-decoration: none;
  transition: color 140ms ease, border-color 140ms ease, background-color 140ms ease;
}
.source:hover { color: var(--ink); border-color: var(--accent-line); background: var(--surface-2); }
.source__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind {
  flex: none;
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase;
  padding: 0.08rem 0.3rem;
  border-radius: 3px;
  border: 1px solid var(--line);
  color: var(--ink-4);
}
.kind[data-kind="x"] { color: var(--ink); border-color: var(--ink-4); }
.kind[data-kind="primary"] { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.source__time {
  flex: none;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-4);
}

/* ---- empty state ---- */
.empty {
  padding: clamp(2.5rem, 9vw, 4.5rem) 0;
  text-align: center;
  border-top: 1px solid var(--line-soft);
}
.empty__title {
  font-family: var(--serif);
  font-size: 1.25rem;
  margin-bottom: 0.4rem;
}
.empty__body { color: var(--ink-3); font-size: 0.9rem; margin: 0 auto 1.2rem; max-width: 28rem; }
.empty[hidden] { display: none; }

.notice {
  margin: 2rem 0;
  padding: 1rem 1.1rem;
  border: 1px dashed var(--accent-line);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--ink-2);
  font-size: 0.88rem;
}
.notice[hidden] { display: none; }
.notice code { font-family: var(--mono); font-size: 0.85em; }

/* ---- footer ---- */
.foot {
  margin-top: clamp(2rem, 6vw, 3.5rem);
  border-top: 1px solid var(--line);
  padding-block: 1.6rem clamp(2.5rem, 8vw, 4rem);
  color: var(--ink-4);
  font-size: 0.76rem;
}
.foot p { margin: 0 0 0.35rem; }
.foot__meta { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; font-variant-numeric: tabular-nums; }

/* ---- back to top ---- */
.totop {
  position: fixed;
  right: clamp(0.9rem, 3vw, 1.6rem);
  bottom: clamp(0.9rem, 3vw, 1.6rem);
  z-index: 45;
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.6rem; height: 2.6rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  box-shadow: var(--shadow);
  cursor: pointer;
  opacity: 0; visibility: hidden;
  transform: translateY(0.5rem);
  transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease, color 140ms ease, border-color 140ms ease;
}
.totop svg { width: 1.05rem; height: 1.05rem; }
.totop:hover { color: var(--ink); border-color: var(--accent-line); }
.totop[data-visible="true"] { opacity: 1; visibility: visible; transform: translateY(0); }

/* ---- wider screens: a touch more air, still one column ---- */
@media (min-width: 60rem) {
  :root { --measure: 42rem; }
  .story[data-weight="brief"] { padding-block: 1.8rem; }
}

/* ---- motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .totop { transform: none; }
}

/* ---- print: a clean one-pager, everything expanded ---- */
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #fff; --ink: #000; --ink-2: #1a1a1a; --ink-3: #444; --ink-4: #666; --line: #ccc; --line-soft: #ddd; --accent: #7a4310; }
  body { font-size: 11pt; }
  .controls, .totop, .progress, .toggle, .skip-link, .iconbtn { display: none !important; }
  .more[hidden] { display: block !important; }
  .story { break-inside: avoid; }
  a { text-decoration: none; }
}
</style>

<a class="skip-link" href="#stories">Skip to stories</a>

<div class="progress" aria-hidden="true"><div class="progress__bar" id="progress-bar"></div></div>

<header class="masthead">
  <div class="wrap">
    <div class="masthead__row">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Anchor&nbsp;Brief</span>
      </div>
      <button type="button" class="iconbtn" id="theme-toggle" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" id="theme-icon">

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function safeHref(url) {
    var s = String(url || '').trim();
    return /^https?:\/\//i.test(s) ? s : null;
  }

  /* Highlight query matches without ever injecting markup. */
  function withHighlight(node, text, query) {
    node.textContent = '';
    var raw = String(text === undefined || text === null ? '' : text);
    if (!query) { node.textContent = raw; return node; }
    var haystack = fold(raw);
    var needle = fold(query);
    if (!needle || haystack.length !== raw.length) { node.textContent = raw; return node; }
    var from = 0;
    var at = haystack.indexOf(needle, from);
    if (at === -1) { node.textContent = raw; return node; }
    while (at !== -1) {
      if (at > from) node.appendChild(document.createTextNode(raw.slice(from, at)));
      node.appendChild(el('mark', null, raw.slice(at, at + needle.length)));
      from = at + needle.length;
      at = haystack.indexOf(needle, from);
    }
    if (from < raw.length) node.appendChild(document.createTextNode(raw.slice(from)));
    return node;
  }

  /* ---------------- masthead / hero / footer ---------------- */

  var editionLabel = EDITION_LABELS[data.edition] || (data.edition ? String(data.edition) : 'Briefing');
  $('edition-label').textContent = editionLabel;
  $('hero-headline').textContent = data.headline || '';
  $('coverage').textContent = data.coverage ? 'Coverage: ' + data.coverage : '';

  var stamp = $('generated-at');
  if (generated) {
    stamp.dateTime = data.generatedAt;
    stamp.textContent = FMT_STAMP.format(generated).replace(/\u202f/g, ' ');
    stamp.title = 'Generated ' + data.generatedAt + ' (' + tz + ')';
  } else {
    stamp.textContent = String(data.generatedAt || '');
  }

  if (!document.title || /^Anchor Brief$/.test(document.title)) {
    var titleBits = ['Anchor Brief'];
    if (data.edition) titleBits.push(editionLabel);
    if (generated) titleBits.push(FMT_DAYTIME.format(generated));
    document.title = titleBits.join(' \u2014 ');
  }

  var sourceCount = stories.reduce(function (n, s) { return n + (Array.isArray(s.sources) ? s.sources.length : 0); }, 0);
  $('foot-edition').textContent = editionLabel;
  $('foot-count').textContent = stories.length + (stories.length === 1 ? ' story' : ' stories');
  $('foot-sources').textContent = sourceCount + (sourceCount === 1 ? ' source' : ' sources');

  /* ---------------- theme ---------------- */

  var themeToggle = $('theme-toggle');
  var themeLabel = $('theme-label');
  var themeIcon = $('theme-icon');

  var SUN = '<circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>';
  var MOON = '<path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"></path>';

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function paintThemeButton() {
    var isLight = currentTheme() === 'light';
    themeIcon.innerHTML = isLight ? MOON : SUN;
    themeLabel.textContent = isLight ? 'Dark' : 'Light';
    themeToggle.setAttribute('aria-pressed', isLight ? 'true' : 'false');
    themeToggle.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
  }

  function setTheme(theme, persist) {
    document.documentElement.setAttribute('data-theme', theme);
    if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch (err) {} }
    paintThemeButton();
    repaintPlaceholders();
  }

  paintThemeButton();
  themeToggle.addEventListener('click', function () {
    setTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
  });

  if (window.matchMedia) {
    var mqLight = window.matchMedia('(prefers-color-scheme: light)');
    var onScheme = function (event) {
      var stored = null;
      try { stored = localStorage.getItem(THEME_KEY); } catch (err) {}
      if (stored === 'dark' || stored === 'light') return;
      setTheme(event.matches ? 'light' : 'dark', false);
    };
    if (mqLight.addEventListener) mqLight.addEventListener('change', onScheme);
    else if (mqLight.addListener) mqLight.addListener(onScheme);
  }

  function repaintPlaceholders() {
    var light = currentTheme() === 'light';
    var frames = document.querySelectorAll('.figure__frame[data-seed]');
    for (var i = 0; i < frames.length; i++) {
      frames[i].style.setProperty('--ph-gradient', gradientFor(frames[i].getAttribute('data-seed'), light));
    }
  }

  /* ---------------- story cards ---------------- */

  var cards = [];

  function buildSources(story) {
    var list = Array.isArray(story.sources) ? story.sources : [];
    var foot = el('footer', 'sources');
    var heading = el('h3', 'sr-only', 'Sources');
    foot.appendChild(heading);
    var ul = el('ul');
    list.forEach(function (source) {
      if (!source) return;
      var li = el('li');
      var href = safeHref(source.url);
      var item = href ? el('a', 'source') : el('span', 'source');
      if (href) {
        item.href = href;
        item.target = '_blank';
        item.rel = 'noopener noreferrer';
      }
      var kind = KIND_LABELS[source.kind] ? source.kind : 'article';
      var badge = el('span', 'kind', kind === 'x' ? 'X' : KIND_LABELS[kind]);
      badge.setAttribute('data-kind', kind);
      badge.setAttribute('aria-hidden', 'true');
      item.appendChild(badge);
      item.appendChild(el('span', 'source__label', source.label || href || 'Source'));
      var when = formatSourceTime(source.time);
      if (when) {
        var t = el('time', 'source__time', when);
        t.dateTime = source.time;
        item.appendChild(t);
      }
      var srBits = [KIND_LABELS[kind] === 'X' ? 'X post' : KIND_LABELS[kind], source.label || ''];
      if (when) srBits.push(when);
      item.setAttribute('aria-label', srBits.filter(Boolean).join(' \u2014 '));
      li.appendChild(item);
      ul.appendChild(li);
    });
    foot.appendChild(ul);
    return list.length ? foot : null;
  }

  function buildFigure(story) {
    var image = story.image;
    if (!image || !safeHref(image.url)) return null;
    var figure = el('figure', 'figure');
    var frame = el('div', 'figure__frame');
    frame.setAttribute('data-seed', story.id || story.title || '');
    frame.style.setProperty('--ph-gradient', gradientFor(story.id || story.title || '', currentTheme() === 'light'));

    var img = document.createElement('img');
    img.src = safeHref(image.url);
    img.alt = image.alt || '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    img.addEventListener('error', function () {
      frame.setAttribute('data-img', 'failed');
    });
    frame.appendChild(img);
    figure.appendChild(frame);

    if (image.credit) {
      var caption = el('figcaption');
      caption.appendChild(document.createTextNode('Image: '));
      var creditHref = safeHref(image.creditUrl);
      if (creditHref) {
        var link = el('a', null, image.credit);
        link.href = creditHref;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        caption.appendChild(link);
      } else {
        caption.appendChild(document.createTextNode(image.credit));
      }
      figure.appendChild(caption);
    }
    return figure;
  }

  function buildCard(story, index) {
    var facts = Array.isArray(story.facts) ? story.facts.filter(function (f) { return f; }) : [];
    var weight = WEIGHT_RANK[story.weight] === undefined ? 'normal' : story.weight;
    var slug = String(story.id || 'story-' + (index + 1));

    var article = el('article', 'story');
    article.id = slug;
    article.setAttribute('data-weight', weight);
    article.setAttribute('aria-labelledby', slug + '-title');

    var eyebrow = el('div', 'story__eyebrow');
    if (weight === 'lead') eyebrow.appendChild(el('span', 'flag', 'Lead'));
    var topics = Array.isArray(story.topics) ? story.topics.filter(Boolean) : [];
    if (topics.length) {
      var tags = el('ul', 'tags');
      topics.forEach(function (topic) { tags.appendChild(el('li', 'tag', topic)); });
      eyebrow.appendChild(tags);
    }
    if (eyebrow.childNodes.length) article.appendChild(eyebrow);

    var h2 = el('h2', 'story__title');
    h2.id = slug + '-title';
    var titleLink = el('a', null, story.title || '');
    titleLink.href = '#' + slug;
    h2.appendChild(titleLink);
    article.appendChild(h2);

    var figure = buildFigure(story);
    if (figure) article.appendChild(figure);

    var head = facts.slice(0, VISIBLE_FACTS);
    var tail = facts.slice(VISIBLE_FACTS);
    var headList = el('ul', 'facts');
    head.forEach(function (fact) { headList.appendChild(el('li', null, fact)); });
    if (head.length) article.appendChild(headList);

    var hasWhy = typeof story.whyItMatters === 'string' && story.whyItMatters.trim().length > 0;
    var more = null;
    var toggle = null;

    if (tail.length || hasWhy) {
      more = el('div', 'more');
      more.id = slug + '-more';
      more.hidden = true;
      if (tail.length) {
        var tailList = el('ul', 'facts');
        tail.forEach(function (fact) { tailList.appendChild(el('li', null, fact)); });
        more.appendChild(tailList);
      }
      if (hasWhy) {
        var why = el('div', 'why');
        why.appendChild(el('p', 'why__label', 'Why it matters'));
        why.appendChild(el('p', null, story.whyItMatters.trim()));
        more.appendChild(why);
      }

      toggle = el('button', 'toggle');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-controls', more.id);
      var toggleText = el('span', 'toggle__text');
      var moreBits = [];
      if (tail.length) moreBits.push(tail.length + ' more ' + (tail.length === 1 ? 'point' : 'points'));
      if (hasWhy) moreBits.push('why it matters');
      toggle.appendChild(toggleText);
      var chev = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      chev.setAttribute('viewBox', '0 0 24 24');
      chev.setAttribute('fill', 'none');
      chev.setAttribute('stroke', 'currentColor');
      chev.setAttribute('stroke-width', '2');
      chev.setAttribute('stroke-linecap', 'round');
      chev.setAttribute('stroke-linejoin', 'round');
      chev.setAttribute('class', 'toggle__chev');
      chev.setAttribute('aria-hidden', 'true');
      var chevPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      chevPath.setAttribute('d', 'M6 9l6 6 6-6');
      chev.appendChild(chevPath);
      toggle.appendChild(chev);

      article.appendChild(more);
      article.appendChild(toggle);

      var card;
      var setExpanded = function (expanded) {
        more.hidden = !expanded;
        toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        toggleText.textContent = expanded ? 'Show less' : 'Show ' + moreBits.join(' + ');
        toggle.setAttribute('aria-label', (expanded ? 'Collapse' : 'Expand') + ' details for ' + (story.title || 'this story'));
        if (card) card.expanded = expanded;
      };
      toggle.addEventListener('click', function () {
        setExpanded(more.hidden);
      });
      setExpanded(false);
      card = { setExpanded: setExpanded };
      article.__card = card;
    }

    var sources = buildSources(story);
    if (sources) article.appendChild(sources);

    var haystack = fold([story.title || ''].concat(facts).join(' \u2014 '));

    var record = {
      story: story,
      node: article,
      titleLink: titleLink,
      topics: topics,
      facts: facts,
      headList: headList,
      more: more,
      toggle: toggle,
      haystack: haystack,
      tailHaystack: fold(tail.join(' \u2014 ')),
      setExpanded: article.__card ? article.__card.setExpanded : null,
      visible: true
    };
    return record;
  }

  var storiesRoot = $('stories');
  var frag = document.createDocumentFragment();
  stories.forEach(function (story, i) {
    var record = buildCard(story, i);
    cards.push(record);
    frag.appendChild(record.node);
  });
  storiesRoot.appendChild(frag);

  /* ---------------- filters ---------------- */

  var activeTopics = Object.create(null);
  var query = '';

  var topicOrder = [];
  var topicSeen = Object.create(null);
  cards.forEach(function (card) {
    card.topics.forEach(function (topic) {
      if (!topicSeen[topic]) { topicSeen[topic] = true; topicOrder.push(topic); }
    });
  });

  var chipsRoot = $('chips');
  var chipNodes = [];

  function makeChip(label, value, isAll) {
    var button = el('button', 'chip');
    button.type = 'button';
    button.setAttribute('aria-pressed', 'false');
    button.appendChild(el('span', 'chip__label', label));
    var count = el('span', 'chip__count', '0');
    count.setAttribute('aria-hidden', 'true');
    button.appendChild(count);
    button.addEventListener('click', function () {
      if (isAll) {
        activeTopics = Object.create(null);
      } else if (activeTopics[value]) {
        delete activeTopics[value];
      } else {
        activeTopics[value] = true;
      }
      apply();
    });
    chipsRoot.appendChild(button);
    return { node: button, count: count, value: value, isAll: isAll, label: label };
  }

  chipNodes.push(makeChip('All', null, true));
  topicOrder.forEach(function (topic) { chipNodes.push(makeChip(topic, topic, false)); });

  var searchInput = $('search');
  var searchWrap = $('search-wrap');
  var searchClear = $('search-clear');
  var statusText = $('status-text');
  var resetButton = $('reset');
  var emptyBox = $('empty');
  var emptyBody = $('empty-body');

  function matchesQuery(card) {
    if (!query) return true;
    return card.haystack.indexOf(query) !== -1;
  }

  function matchesTopics(card) {
    var keys = Object.keys(activeTopics);
    if (!keys.length) return true;
    for (var i = 0; i < keys.length; i++) {
      if (card.topics.indexOf(keys[i]) !== -1) return true;
    }
    return false;
  }

  function renderHighlights() {
    cards.forEach(function (card) {
      withHighlight(card.titleLink, card.story.title || '', query);
      var items = card.node.querySelectorAll('.facts li');
      var all = card.facts;
      for (var i = 0; i < items.length && i < all.length; i++) {
        withHighlight(items[i], all[i], query);
      }
    });
  }

  function apply() {
    var keys = Object.keys(activeTopics);
    var shown = 0;

    cards.forEach(function (card) {
      var visible = matchesTopics(card) && matchesQuery(card);
      card.visible = visible;
      card.node.hidden = !visible;
      if (visible) shown++;
      /* If the search term only appears in collapsed content, open it. */
      if (visible && query && card.setExpanded && card.tailHaystack.indexOf(query) !== -1) {
        card.setExpanded(true);
      }
    });

    renderHighlights();

    /* Facet counts reflect the search query, not the topic selection. */
    var searchMatches = cards.filter(matchesQuery);
    chipNodes.forEach(function (chip) {
      var n = chip.isAll
        ? searchMatches.length
        : searchMatches.filter(function (card) { return card.topics.indexOf(chip.value) !== -1; }).length;
      chip.count.textContent = String(n);
      chip.node.setAttribute('data-empty', n === 0 ? 'true' : 'false');
      var pressed = chip.isAll ? keys.length === 0 : !!activeTopics[chip.value];
      chip.node.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      chip.node.setAttribute('aria-label', chip.label + ' \u2014 ' + n + ' of ' + cards.length + ' stories' + (pressed ? ', selected' : ''));
    });

    var filtered = keys.length > 0 || query.length > 0;
    resetButton.hidden = !filtered;
    searchWrap.setAttribute('data-filled', query.length > 0 ? 'true' : 'false');

    var bits = ['Showing ' + shown + ' of ' + cards.length + (cards.length === 1 ? ' story' : ' stories')];
    if (keys.length) bits.push(keys.length === 1 ? 'topic: ' + keys[0] : keys.length + ' topics: ' + keys.join(', '));
    if (query) bits.push('search: \u201c' + searchInput.value.trim() + '\u201d');
    statusText.textContent = bits.join(' \u00b7 ');

    emptyBox.hidden = shown !== 0;
    emptyBody.textContent = query
      ? 'No story matches \u201c' + searchInput.value.trim() + '\u201d' + (keys.length ? ' within the selected ' + (keys.length === 1 ? 'topic' : 'topics') + '.' : '.')
      : 'No story in this briefing carries the selected ' + (keys.length === 1 ? 'topic' : 'topics') + '.';
  }

  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      query = fold(searchInput.value.trim());
      apply();
    }, 110);
  });
  searchInput.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && searchInput.value) {
      event.stopPropagation();
      clearSearch();
    }
  });

  function clearSearch() {
    searchInput.value = '';
    query = '';
    apply();
  }

  searchClear.addEventListener('click', function () {
    clearSearch();
    searchInput.focus();
  });

  function resetAll() {
    activeTopics = Object.create(null);
    clearSearch();
  }

  resetButton.addEventListener('click', function () {
    resetAll();
    searchInput.focus();
  });
  $('empty-reset').addEventListener('click', function () {
    resetAll();
    searchInput.focus();
  });

  /* "/" focuses search, like a reader would expect. */
  document.addEventListener('keydown', function (event) {
    if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
    var tag = (event.target && event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (event.target && event.target.isContentEditable)) return;
    event.preventDefault();
    searchInput.focus();
    searchInput.select();
  });

  apply();

  /* ---------------- deep link ---------------- */

  function revealHash() {
    var id = decodeURIComponent(String(location.hash || '').replace(/^#/, ''));
    if (!id) return;
    var card = cards.filter(function (c) { return c.node.id === id; })[0];
    if (!card) return;
    if (!card.visible) resetAll();
    if (card.setExpanded) card.setExpanded(true);
    card.node.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
  }
  window.addEventListener('hashchange', revealHash);
  if (location.hash) setTimeout(revealHash, 0);

  /* ---------------- progress + back to top ---------------- */

  var bar = $('progress-bar');
  var totop = $('totop');
  var ticking = false;

  function onScroll() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      ticking = false;
      var doc = document.documentElement;
      var scrollable = (doc.scrollHeight || 0) - window.innerHeight;
      var y = window.pageYOffset || doc.scrollTop || 0;
      var pct = scrollable > 40 ? Math.min(100, Math.max(0, (y / scrollable) * 100)) : 0;
      bar.style.width = pct.toFixed(2) + '%';
      totop.setAttribute('data-visible', y > 620 ? 'true' : 'false');
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  onScroll();

  totop.addEventListener('click', function () {
    if (reduceMotion.matches) {
      window.scrollTo(0, 0);
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    var brand = document.querySelector('.brand__name');
    if (brand) { brand.setAttribute('tabindex', '-1'); brand.focus({ preventScroll: true }); }
  });
})();
</script>
</body>
</html>
