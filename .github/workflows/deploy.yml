name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Vote appends land in data/votes.jsonl only — skip Pages rebuilds for those.
    # Briefing publishes under data/*.json still trigger deploy as usual.
    paths-ignore:
      - 'data/votes.jsonl'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build
        env:
          BASE_PATH: /anchor-brief
          # Optional: Apps Script web app URL (see docs/votes.md). Empty = local-only votes.
          PUBLIC_VOTE_URL: ${{ vars.PUBLIC_VOTE_URL }}

      - name: Ensure .nojekyll
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
